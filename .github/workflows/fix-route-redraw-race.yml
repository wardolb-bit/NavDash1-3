name: Fix route redraw race

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-route-redraw-race.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch route redraw race
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/NavMapMainOverlayV2.tsx')
          s = p.read_text()
          old = '''      const signature = routeSignature(nextRoute);\n      if (signature !== routeSignatureRef.current) { routeSignatureRef.current = signature; setRoute(nextRoute); }\n      timer = window.setTimeout(refresh, 1500);\n'''
          new = '''      const signature = routeSignature(nextRoute);\n      if (signature !== routeSignatureRef.current) {\n        routeSignatureRef.current = signature;\n        setRoute(nextRoute);\n      } else if (nextRoute.length >= 2 && mapRef.current && !routeLayerRef.current) {\n        setRoute([...nextRoute]);\n      }\n      timer = window.setTimeout(refresh, 1500);\n'''
          assert old in s, 'route refresh block not found'
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm .github/workflows/fix-route-redraw-race.yml
          git diff --check
          npm ci
          npm run build
          git diff -- components/NavMapMainOverlayV2.tsx
          git config user.name "wardolb-bit"
          git config user.email "wardolb@live.com"
          git add components/NavMapMainOverlayV2.tsx .github/workflows/fix-route-redraw-race.yml
          git commit -m "Fix route redraw after map-ready race"
          git push
