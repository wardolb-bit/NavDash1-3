name: Patch celestial track render

on:
  push:
    branches: ["feature/celestial-track-events-v2"]

permissions:
  contents: write

jobs:
  patch-and-build:
    if: ${{ !contains(github.event.head_commit.message, 'Make celestial track markers visible') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/celestial-track-events-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply marker render patch
        run: python3 scripts/patch-celestial-track-render.py
      - run: npm ci
      - run: npm run build
      - name: Commit feature
        run: |
          git config user.name "wardolb-bit"
          git config user.email "wardolb@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Make celestial track markers visible"
          git push origin HEAD:feature/celestial-track-events-v2
