name: Validate direct main Pilot AIS

on:
  push:
    branches:
      - fix/main-direct-pilot-ais
    paths:
      - .github/workflows/validate-direct-main-pilot-ais.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/main-direct-pilot-ais
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
