name: NavDash audit cleanup preview

on:
  push:
    branches:
      - audit-cleanup-preview-2026-09-15

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply verified cleanup phase 1
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {found}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          exact('tsconfig.json', '"target": "es5"', '"target": "es2017"')
          exact('app/NavDashConsole.tsx', 'if (len2 <= 1e-16) return { ratio: 0, xte: 0, side: "--" };', 'if (len2 <= 1e-16) return { ratio: 0, projectionRatio: 0, xte: 0, side: "--" };')

          p = Path('app/position-report/page.tsx')
          text = p.read_text(encoding='utf-8')
          pattern = re.compile(r"function normalizePositionHistory\(candidate: unknown\): PositionLogEntry\[] \{.*?\n\}\n\nexport default function PositionReportPage", re.S)
          replacement = '''function normalizePositionHistory(candidate: unknown): PositionLogEntry[] {
            const entries = Array.isArray(candidate)
              ? candidate
              : candidate && typeof candidate === 'object' && Array.isArray((candidate as { entries?: unknown[] }).entries)
                ? (candidate as { entries: unknown[] }).entries
                : [];
            const normalized: PositionLogEntry[] = [];
            for (const entry of entries) {
              if (!entry || typeof entry !== 'object') continue;
              const item = entry as Record<string, unknown>;
              const lat = Number(item.lat);
              const lon = Number(item.lon);
              const timestamp = Number(item.timestamp);
              if (!Number.isFinite(lat) || !Number.isFinite(lon) || !Number.isFinite(timestamp)) continue;
              normalized.push({
                lat,
                lon,
                timestamp,
                sog: Number.isFinite(Number(item.sog)) ? Number(item.sog) : null,
                cog: Number.isFinite(Number(item.cog)) ? Number(item.cog) : null,
                heading: Number.isFinite(Number(item.heading)) ? Number(item.heading) : null,
                receivedAt: typeof item.receivedAt === 'string' ? item.receivedAt : undefined,
              });
            }
            return normalized.sort((a, b) => a.timestamp - b.timestamp);
          }

          export default function PositionReportPage'''
          text2, n = pattern.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit(f'position history block matches={n}')
          p.write_text(text2, encoding='utf-8')

          exact('components/BridgeTrackedAisTargets.tsx', '      mapElement.addEventListener("dblclick", toggleNearestTarget, true);', '      element.addEventListener("dblclick", toggleNearestTarget, true);')
          exact('components/CrewNoaaMap.tsx', '      if (routePoints.length > 1) {', '      if (route && routePoints.length > 1) {')
          exact('components/EncObjectInfo.tsx', '  const colourAbbr = [...new Set(colours)].map((colour) => ({ White: "W", Red: "R", Green: "G", Yellow: "Y", Blue: "Bu", Amber: "Am", Orange: "Or", Violet: "Vi" }[colour] || colour)).join("/");', '  const colourAbbreviations: Record<string, string> = { White: "W", Red: "R", Green: "G", Yellow: "Y", Blue: "Bu", Amber: "Am", Orange: "Or", Violet: "Vi" };\n  const colourAbbr = [...new Set(colours)].map((colour) => colourAbbreviations[colour] || colour).join("/");')
          exact('lib/r2Storage.ts', '    body: method === "PUT" ? body : undefined,', '    body: method === "PUT" ? (body as unknown as BodyInit) : undefined,')

          day = Path('app/day-fixes.css')
          bridge = Path('app/bridge-console.css')
          day_text = day.read_text(encoding='utf-8').replace('/* Preview-only bridge header and Day Mode corrections. Loaded after bridge-console.css. */', '/* Bridge header and Day Mode corrections. */', 1)
          bridge.write_text(bridge.read_text(encoding='utf-8').rstrip() + '\n\n' + day_text.strip() + '\n', encoding='utf-8')
          day.unlink()
          exact('app/layout.tsx', "import './day-fixes.css';\n", '')

          for dead in [
              'app/route-weather-lab/RouteProfileDistanceUnitFix.tsx',
              'app/route-weather-lab/RouteProfileTableIndexCompat.tsx',
              'components/NoaaRouteWeatherOverlay.tsx',
              'components/NoaaRouteWeatherOverlayFixed.tsx',
          ]:
              p = Path(dead)
              if not p.exists():
                  raise SystemExit(f'Expected cleanup candidate missing: {dead}')
              p.unlink()
          PY

      - name: Install dependencies and generate lockfile
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Commit phase 1 to preview branch
        run: |
          rm -f .github/workflows/audit-cleanup-preview.yml .github/workflows/apply-audit-cleanup-phase1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Audit cleanup phase 1: type hygiene and dead code"
          git push origin HEAD:audit-cleanup-preview-2026-09-15
