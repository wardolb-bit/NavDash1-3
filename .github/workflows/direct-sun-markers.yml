name: Apply direct sun route markers

on:
  push:
    branches: ["fix/direct-sun-markers"]

permissions:
  contents: write

jobs:
  patch-and-build:
    if: ${{ !contains(github.event.head_commit.message, 'Put sunrise sunset markers in NavDash map layer') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/direct-sun-markers
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply direct map patch
        run: python3 scripts/apply-direct-sun-markers.py
      - run: npm ci
      - run: npm run build
      - name: Commit patched NavDash
        run: |
          git config user.name "wardolb-bit"
          git config user.email "wardolb@users.noreply.github.com"
          git add app/page.tsx app/layout.tsx
          git commit -m "Put sunrise sunset markers in NavDash map layer"
          git push origin HEAD:fix/direct-sun-markers
