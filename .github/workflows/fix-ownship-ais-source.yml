name: Fix ownship AIS source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ownship-ais-source.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restrict navigation position to own-ship VDO
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/NavDashConsole.tsx')
          s = p.read_text()
          old = '      const decoded = line ? decodeOwnShip(line) : ownShipFromParsedMessage(msg);\n'
          new = '      const decoded = line ? decodeOwnShip(line) : null;\n'
          assert old in s, 'own-ship fallback line not found'
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/fix-ownship-ais-source.yml
          git diff --check
          npm ci
          npm run build
          git diff -- app/NavDashConsole.tsx
          git config user.name "wardolb-bit"
          git config user.email "wardolb@live.com"
          git add app/NavDashConsole.tsx .github/workflows/fix-ownship-ais-source.yml
          git commit -m "Restrict bridge position to own-ship AIS VDO"
          git push
