name: NavDash map view fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/navdash-map-view-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply exact map view patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()

          old_ref = '  const routeWsRef = useRef<WebSocket | null>(null);\n'
          new_ref = old_ref + '  const hasInitialOwnShipCenterRef = useRef(false);\n'
          assert old_ref in s and 'hasInitialOwnShipCenterRef' not in s
          s = s.replace(old_ref, new_ref, 1)

          old_fit = '''      try {\n        const bounds = L.latLngBounds(routeLatLngs as any);\n        map.fitBounds(bounds, { padding: [35, 35], maxZoom: 10 });\n      } catch {\n        // Keep current view if bounds cannot be calculated.\n      }\n\n'''
          assert old_fit in s
          s = s.replace(old_fit, '', 1)

          old_marker = '''        ownMarkerRef.current.setLatLng(position);\n      }\n\n      if (ownVectorRef.current) {'''
          new_marker = '''        ownMarkerRef.current.setLatLng(position);\n      }\n\n      if (!hasInitialOwnShipCenterRef.current) {\n        hasInitialOwnShipCenterRef.current = true;\n        map.setView(position, Math.max(map.getZoom(), 7), { animate: false });\n      }\n\n      if (ownVectorRef.current) {'''
          assert old_marker in s
          s = s.replace(old_marker, new_marker, 1)

          p.write_text(s)
          PY
          rm .github/workflows/navdash-map-view-fix.yml
          git diff --check
          git diff -- app/page.tsx
          git config user.name "wardolb-bit"
          git config user.email "wardolb@live.com"
          git add app/page.tsx .github/workflows/navdash-map-view-fix.yml
          git commit -m "Stop route auto-fit and center initial own ship"
          git push
