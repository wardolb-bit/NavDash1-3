name: Preview ETA destination local time

on:
  push:
    branches: [eta-preview]

permissions:
  contents: write

jobs:
  patch-eta:
    if: ${{ !contains(github.event.head_commit.message, '[eta-preview-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eta-preview

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install coordinate timezone lookup
        run: npm install tz-lookup@6.1.25 --save

      - name: Patch ETA display
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/page.tsx')
          text = path.read_text(encoding='utf-8')

          import_anchor = 'import { useBridgeTheme } from "../lib/useBridgeTheme";'
          import_line = 'import tzlookup from "tz-lookup";'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('useBridgeTheme import anchor not found')
              text = text.replace(import_anchor, import_anchor + '\n' + import_line, 1)

          old_formatter = '''function formatHours(hours: number | null | undefined) {
            if (hours === null || hours === undefined || !Number.isFinite(hours)) return "--";
            const h = Math.floor(hours);
            const m = Math.round((hours - h) * 60);
            return `${h}h ${m.toString().padStart(2, "0")}m`;
          }'''

          new_formatter = '''type EtaDisplay = {
            primary: string;
            zone: string;
            description: string;
          };

          function zonePart(date: Date, timeZone: string, style: "short" | "long" | "longOffset") {
            try {
              return new Intl.DateTimeFormat("en-US", {
                timeZone,
                timeZoneName: style,
                hour: "2-digit",
              })
                .formatToParts(date)
                .find((part) => part.type === "timeZoneName")?.value || "";
            } catch {
              return "";
            }
          }

          function normalizeUtcOffset(value: string) {
            if (!value) return "UTC";
            return value.replace(/^GMT/, "UTC").replace("-", "−");
          }

          function formatDestinationEta(
            hours: number | null | undefined,
            destination: { lat: number; lon: number },
          ): EtaDisplay {
            if (hours === null || hours === undefined || !Number.isFinite(hours)) {
              return { primary: "--", zone: "--", description: "Destination local time" };
            }

            const arrival = new Date(Date.now() + hours * 60 * 60 * 1000);
            let timeZone = "UTC";

            try {
              timeZone = tzlookup(destination.lat, destination.lon);
            } catch {
              timeZone = "UTC";
            }

            const dateText = new Intl.DateTimeFormat("en-US", {
              timeZone,
              month: "short",
              day: "2-digit",
            }).format(arrival).toUpperCase();

            const timeText = new Intl.DateTimeFormat("en-US", {
              timeZone,
              hour: "2-digit",
              minute: "2-digit",
              hourCycle: "h23",
            }).format(arrival).replace(":", "");

            const shortZone = zonePart(arrival, timeZone, "short") || timeZone;
            const longZone = zonePart(arrival, timeZone, "long") || timeZone.replace(/_/g, " ");
            const offset = normalizeUtcOffset(zonePart(arrival, timeZone, "longOffset"));

            return {
              primary: `${dateText} ${timeText}`,
              zone: `${shortZone} · ${offset}`,
              description: `${longZone} · ${timeZone}`,
            };
          }'''

          if 'function formatDestinationEta(' not in text:
              if old_formatter not in text:
                  raise SystemExit('formatHours anchor not found')
              text = text.replace(old_formatter, new_formatter, 1)

          old_calc = '''  const dtg = remainingRouteDistanceNm(route, activeLeg);
            const etaHours = dtg && ownShip?.sog ? dtg / Math.max(ownShip.sog, 0.1) : null;
            const legBearing = activeLeg ? bearingDeg(activeLegStart.lat, activeLegStart.lon, activeLegEnd.lat, activeLegEnd.lon) : null;
            const destination = route[route.length - 1] || routeFallback;'''

          new_calc = '''  const dtg = remainingRouteDistanceNm(route, activeLeg);
            const etaHours = dtg !== null && dtg !== undefined && ownShip?.sog ? dtg / Math.max(ownShip.sog, 0.1) : null;
            const legBearing = activeLeg ? bearingDeg(activeLegStart.lat, activeLegStart.lon, activeLegEnd.lat, activeLegEnd.lon) : null;
            const destination = route[route.length - 1] || routeFallback;
            const etaDisplay = formatDestinationEta(etaHours, destination);'''

          if 'const etaDisplay = formatDestinationEta' not in text:
              if old_calc not in text:
                  raise SystemExit('ETA calculation anchor not found')
              text = text.replace(old_calc, new_calc, 1)

          old_card = '''                  <div className={softPanelClass}>
                    <div className={labelClass}>ETA</div>
                    <div className={dayMode ? "mt-2 text-2xl font-black text-slate-950" : "mt-2 text-2xl font-black text-white"}>{formatHours(etaHours)}</div>
                  </div>'''

          new_card = '''                  <div className={softPanelClass}>
                    <div className={labelClass}>ETA · Destination Local</div>
                    <div className={dayMode ? "mt-2 text-2xl font-black text-slate-950" : "mt-2 text-2xl font-black text-white"}>{etaDisplay.primary}</div>
                    <div className={`mt-1 text-xs font-black ${mutedClass}`}>{etaDisplay.zone}</div>
                    <div className={`mt-1 text-xs ${mutedClass}`}>{etaDisplay.description}</div>
                  </div>'''

          if 'ETA · Destination Local' not in text:
              if old_card not in text:
                  raise SystemExit('ETA card anchor not found')
              text = text.replace(old_card, new_card, 1)

          path.write_text(text, encoding='utf-8')

      - name: Build sanity check
        run: npm run build

      - name: Commit preview ETA fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/eta-preview-patch.yml
          git add app/page.tsx package.json package-lock.json .github/workflows/eta-preview-patch.yml
          git commit -m "Fix preview ETA destination local time [eta-preview-fixed]"
          git push origin eta-preview
