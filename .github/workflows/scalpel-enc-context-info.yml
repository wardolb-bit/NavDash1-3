name: Scalpel ENC context info

on:
  push:
    paths:
      - '.github/workflows/scalpel-enc-context-info.yml'
      - 'scripts/scalpel-enc-context-info.py'

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-cleanup-preview-2026-09-15
          path: runner
      - uses: actions/checkout@v4
        with:
          ref: main
          path: target
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply ENC context INFO scalpel
        run: python runner/scripts/scalpel-enc-context-info.py
      - name: Install dependencies
        working-directory: target
        run: npm ci --no-audit --no-fund
      - name: Reject new TypeScript errors in changed files
        working-directory: target
        shell: bash
        run: |
          set +e
          npx tsc --noEmit > /tmp/tsc.log 2>&1
          set -e
          cat /tmp/tsc.log
          if grep -E 'app/layout\.tsx|components/EncObjectInfo\.tsx' /tmp/tsc.log \
            | grep -Ev 'components/EncObjectInfo\.tsx\((139,26|139,61|171,63)\)' \
            | grep -q .; then
            echo 'New TypeScript error detected in changed files.'
            exit 1
          fi
      - name: Production build
        working-directory: target
        run: npm run build
      - name: Commit validated main change
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/layout.tsx components/EncObjectInfo.tsx
          git commit -m "Move ENC object info to map context menu"
          git push origin HEAD:main
