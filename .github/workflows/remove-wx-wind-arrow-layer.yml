name: Remove WX wind arrow layer

on:
  push:
    paths:
      - '.github/workflows/remove-wx-wind-arrow-layer.yml'

permissions:
  contents: write

jobs:
  scalpel:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove WX wind arrow layer completely
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/wx-routing/page.tsx')
          text = path.read_text(encoding='utf-8')

          const_pattern = r'^const WX_WIND_LAYER_ID = "navdash-wx-routing-wind";\n'
          layer_pattern = r'    map\.addLayer\(\{\n      id: WX_WIND_LAYER_ID,\n      type: "symbol",\n      source: WX_SOURCE_ID,\n      layout: \{\n        visibility: "none",\n        "text-field": "\^",\n        "text-size": \["interpolate", \["linear"\], \["zoom"\], 2, 14, 8, 22\],\n        "text-rotate": \["get", "rotation"\],\n        "text-allow-overlap": true,\n        "text-ignore-placement": true,\n      \},\n      paint: \{\n        "text-color": nightMode \? "#f8fafc" : "#0f172a",\n        "text-halo-color": nightMode \? "#020617" : "#ffffff",\n        "text-halo-width": 2,\n      \},\n    \}\);\n\n'
          visibility_pattern = r'    if \(map\.getLayer\(WX_WIND_LAYER_ID\)\) \{\n      map\.setLayoutProperty\(WX_WIND_LAYER_ID, "visibility", "none"\);\n    \}\n'

          for label, pattern, flags in [
              ('constant', const_pattern, re.M),
              ('layer block', layer_pattern, 0),
              ('visibility block', visibility_pattern, 0),
          ]:
              text, count = re.subn(pattern, '', text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'Expected exactly one {label}; found {count}. No changes written.')

          if 'WX_WIND_LAYER_ID' in text or '"text-field": "^"' in text:
              raise SystemExit('Wind arrow rendering code still remains after patch.')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/remove-wx-wind-arrow-layer.yml

      - name: Commit scalpel change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/wx-routing/page.tsx .github/workflows/remove-wx-wind-arrow-layer.yml
          git commit -m "Remove WX wind arrow layer completely"
          git push origin HEAD:main
