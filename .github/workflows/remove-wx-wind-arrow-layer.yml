name: Remove WX wind arrow layer

on:
  push:
    paths:
      - '.github/workflows/remove-wx-wind-arrow-layer.yml'

permissions:
  contents: write

jobs:
  scalpel:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove WX wind arrow layer completely
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/wx-routing/page.tsx')
          text = path.read_text(encoding='utf-8')

          targets = [
              'const WX_WIND_LAYER_ID = "navdash-wx-routing-wind";\n',
              '''    map.addLayer({
      id: WX_WIND_LAYER_ID,
      type: "symbol",
      source: WX_SOURCE_ID,
      layout: {
        visibility: "none",
        "text-field": "^",
        "text-size": ["interpolate", ["linear"], ["zoom"], 2, 14, 8, 22],
        "text-rotate": ["get", "rotation"],
        "text-allow-overlap": true,
        "text-ignore-placement": true,
      },
      paint: {
        "text-color": nightMode ? "#f8fafc" : "#0f172a",
        "text-halo-color": nightMode ? "#020617" : "#ffffff",
        "text-halo-width": 2,
      },
    });

''',
              '''    if (map.getLayer(WX_WIND_LAYER_ID)) {
      map.setLayoutProperty(WX_WIND_LAYER_ID, "visibility", "none");
    }
''',
          ]

          for target in targets:
              count = text.count(target)
              if count != 1:
                  raise SystemExit(f'Expected exactly one target block, found {count}. No changes written.')
              text = text.replace(target, '', 1)

          path.write_text(text, encoding='utf-8')

      - name: Verify arrow layer is gone
        shell: python
        run: |
          from pathlib import Path
          text = Path('app/wx-routing/page.tsx').read_text(encoding='utf-8')
          forbidden = ['WX_WIND_LAYER_ID', '"text-field": "^"']
          remaining = [item for item in forbidden if item in text]
          if remaining:
              raise SystemExit(f'Arrow code still present: {remaining}')

      - name: Remove one-shot workflow
        run: rm .github/workflows/remove-wx-wind-arrow-layer.yml

      - name: Commit scalpel change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/wx-routing/page.tsx .github/workflows/remove-wx-wind-arrow-layer.yml
          git commit -m "Remove WX wind arrow layer completely"
          git push origin HEAD:main
