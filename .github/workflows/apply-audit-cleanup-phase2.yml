name: Apply NavDash cleanup phase 2

on:
  push:
    paths:
      - '.github/workflows/apply-audit-cleanup-phase2.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Apply cleanup
        run: python scripts/audit_cleanup_phase2.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Commit cleanup
        run: |
          rm .github/workflows/apply-audit-cleanup-phase2.yml scripts/audit_cleanup_phase2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Audit cleanup phase 2: integrate UI patch layers"
          git push origin HEAD:audit-cleanup-preview-2026-09-15
