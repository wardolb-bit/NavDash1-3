name: Restore logical XTE leg

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-logical-xte-leg.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch logical XTE leg selection
        run: |
          python3 .github/patch-logical-xte.py
          rm .github/patch-logical-xte.py
          rm .github/workflows/restore-logical-xte-leg.yml
          git diff --check
          npm ci
          npm run build
          git diff -- app/NavDashConsole.tsx
          git config user.name "wardolb-bit"
          git config user.email "wardolb@live.com"
          git add app/NavDashConsole.tsx .github/patch-logical-xte.py .github/workflows/restore-logical-xte-leg.yml
          git commit -m "Restore logical route leg selection for XTE"
          git push
