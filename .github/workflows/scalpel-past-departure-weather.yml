name: Scalpel past departure weather

on:
  push:
    paths:
      - '.github/workflows/scalpel-past-departure-weather.yml'

permissions:
  contents: write

jobs:
  patch:
    strategy:
      fail-fast: false
      matrix:
        branch: [main, audit-cleanup-preview-2026-09-15]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply past-departure live-origin scalpel
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/wx-routing/page.tsx')
          s = p.read_text()

          old = '''  const projectionEnabled = projectionMode !== "off";
  const useAisOrigin = projectionMode !== "departure";
'''
          new = '''  const projectionEnabled = projectionMode !== "off";
  const departureDate = departureTime ? new Date(departureTime) : null;
  const departureIsPast = Boolean(
    departureDate && !Number.isNaN(departureDate.getTime()) && departureDate.getTime() <= Date.now(),
  );
  const useAisOrigin = projectionMode !== "departure" || (departureIsPast && Boolean(ownShip));
'''
          if s.count(old) != 1:
              raise SystemExit('Unexpected projection/useAisOrigin block count')
          s = s.replace(old, new, 1)

          old = '''    const departureStart = departureTime ? new Date(departureTime) : null;
    const originPosition = projectionMode === "departure" ? departurePosition : ownShip;
    const positionSource = projectionMode === "departure" ? "departure position/time" : "current AIS position";
    const elapsedHours = projectionMode === "departure"
      ? hoursBetweenDateAndUtcValid(departureStart, selectedTime.valid)
      : Math.max(
          hoursBetweenDateAndUtcValid(new Date(), selectedTime.valid),
          forecastLeadHoursForSelection(timeline, selectedIndex, "", selectedTime.valid),
        );
'''
          new = '''    const departureStart = departureTime ? new Date(departureTime) : null;
    const originPosition = useAisOrigin ? ownShip : departurePosition;
    const positionSource = useAisOrigin
      ? projectionMode === "departure"
        ? "current AIS position (past departure)"
        : "current AIS position"
      : "departure position/time";
    const elapsedHours = useAisOrigin
      ? Math.max(
          hoursBetweenDateAndUtcValid(new Date(), selectedTime.valid),
          forecastLeadHoursForSelection(timeline, selectedIndex, "", selectedTime.valid),
        )
      : hoursBetweenDateAndUtcValid(departureStart, selectedTime.valid);
'''
          if s.count(old) != 1:
              raise SystemExit('Unexpected projection origin block count')
          s = s.replace(old, new, 1)

          old = '''    const originProgress = projectionMode === "departure"
      ? projectionOriginProgress(route, departurePosition)
      : planningOriginProgress(route, ownShip, true);
'''
          new = '''    const originProgress = useAisOrigin
      ? planningOriginProgress(route, ownShip, true)
      : projectionOriginProgress(route, departurePosition);
'''
          if s.count(old) != 1:
              raise SystemExit('Unexpected projection progress block count')
          s = s.replace(old, new, 1)

          old = '''  }, [departurePosition, departureTime, departureCourseDeg, ownShip, planningSpeedKt, projectionEnabled, projectionMode, route, routeDistanceNm, selectedIndex, selectedTime, timeline]);
'''
          new = '''  }, [departurePosition, departureTime, departureCourseDeg, ownShip, planningSpeedKt, projectionEnabled, projectionMode, route, routeDistanceNm, selectedIndex, selectedTime, timeline, useAisOrigin]);
'''
          if s.count(old) != 1:
              raise SystemExit('Unexpected projection dependency block count')
          s = s.replace(old, new, 1)

          old = '''    const originProgress = projectionMode === "departure"
    ? projectionOriginProgress(route, departurePosition)
    : routeProgressNearestPosition(route, ownShip);
  const etaBaseDate = projectionMode === "departure"
    ? (departureTime ? new Date(departureTime) : null)
    : ownShip?.receivedAt
      ? new Date(ownShip.receivedAt)
      : new Date();
'''
          new = '''    const originProgress = useAisOrigin
      ? routeProgressNearestPosition(route, ownShip)
      : projectionOriginProgress(route, departurePosition);
  const etaBaseDate = useAisOrigin
    ? ownShip?.receivedAt
      ? new Date(ownShip.receivedAt)
      : new Date()
    : (departureTime ? new Date(departureTime) : null);
'''
          if s.count(old) != 1:
              raise SystemExit('Unexpected route exposure origin block count')
          s = s.replace(old, new, 1)

          old = '''  }, [departurePosition, departureTime, gribSummary?.routeForecast, ownShip, planningSpeedKt, projectionMode, route, selectedIndex, selectedTime?.valid]);
'''
          new = '''  }, [departurePosition, departureTime, gribSummary?.routeForecast, ownShip, planningSpeedKt, projectionMode, route, selectedIndex, selectedTime?.valid, useAisOrigin]);
'''
          if s.count(old) != 1:
              raise SystemExit('Unexpected route exposure dependency block count')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck --if-present
      - name: Production build
        run: npm run build
      - name: Commit branch patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/wx-routing/page.tsx
          git commit -m "Use live AIS origin for past WX departures"
          git push origin HEAD:${{ matrix.branch }}
