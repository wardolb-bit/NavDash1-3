name: Scalpel past departure weather

on:
  push:
    paths:
      - '.github/workflows/scalpel-past-departure-weather.yml'

permissions:
  contents: write

jobs:
  patch:
    strategy:
      fail-fast: false
      matrix:
        branch:
          - main
          - audit-cleanup-preview-2026-09-15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-cleanup-preview-2026-09-15
          path: runner
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          path: target
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply past-departure live-origin scalpel
        run: python runner/scripts/scalpel-past-departure-weather.py target/app/wx-routing/page.tsx
      - name: Install dependencies
        working-directory: target
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        working-directory: target
        run: npm run typecheck --if-present
      - name: Production build
        working-directory: target
        run: npm run build
      - name: Commit branch patch
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/wx-routing/page.tsx
          git commit -m "Use live AIS origin for past WX departures"
          git push origin HEAD:${{ matrix.branch }}
