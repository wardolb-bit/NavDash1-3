name: Fix sun route index

on:
  push:
    branches: ["fix/direct-sun-markers"]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Fix solar route progress index') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/direct-sun-markers
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Fix active-leg distance index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = 'cumulative[activeLeg.index] + activeLeg.alongTrack'
          new = 'cumulative[Math.max(0, activeLeg.index - 1)] + activeLeg.alongTrack'
          if old not in s:
            raise SystemExit('target expression not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit fix
        run: |
          git config user.name "wardolb-bit"
          git config user.email "wardolb@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Fix solar route progress index"
          git pull --rebase origin fix/direct-sun-markers
          git push origin HEAD:fix/direct-sun-markers
