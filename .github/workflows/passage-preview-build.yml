name: Passage Preview Build
on:
  push:
    branches:
      - feature/passage-workspace-2026-09-29
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
