name: NavDash Date Line route-anchor patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/navdash-dateline-route-anchor.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact Date Line patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/page.tsx")
          text = path.read_text(encoding="utf-8")
          old = 'const displayLon = unwrapLongitudeNear(ownShip.lon, map.getCenter().lng);'
          new = '''const routeBounds = routeLayerRef.current?.getBounds?.();
              const referenceLon = routeBounds?.isValid?.() ? routeBounds.getCenter().lng : map.getCenter().lng;
              const displayLon = unwrapLongitudeNear(ownShip.lon, referenceLon);'''

          count = text.count(old)
          if count != 2:
              raise SystemExit(f"Expected exactly 2 Date Line displayLon targets, found {count}. No changes written.")

          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          git diff --check
          git diff -- app/page.tsx

      - name: Commit only the exact patch
        shell: bash
        run: |
          git rm .github/workflows/navdash-dateline-route-anchor.yml
          git add app/page.tsx
          git diff --cached --check
          git config user.name "wardolb-bit"
          git config user.email "wardolb@live.com"
          git commit -m "Anchor Date Line own ship to route world copy"
          git push origin HEAD:main
