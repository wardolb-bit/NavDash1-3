name: Apply Ownship Longitude Patch

on:
  push:
    branches:
      - preview/navdash-weather-projection-cleanup

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Stage ownship longitude patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/navdash-weather-projection-cleanup
          fetch-depth: 0
      - name: Apply ownship longitude display patch and clean payload
        run: |
          base64 -d .codex/ownship-lon.patch.gz.b64 | gunzip > /tmp/ownship-lon.patch
          git apply --ignore-whitespace /tmp/ownship-lon.patch
          rm -f .codex/ownship-lon.patch.gz.b64
          rmdir .codex 2>/dev/null || true
          rm -f .github/workflows/apply-ownship-lon-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git rm -f --ignore-unmatch .codex/ownship-lon.patch.gz.b64 .github/workflows/apply-ownship-lon-patch.yml
          git commit -m "Fix main ownship longitude display"
          git push origin HEAD:preview/navdash-weather-projection-cleanup
