name: NavDash overlay min zoom fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/navdash-overlay-minzoom-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch active overlay min zoom
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/NavMapMainOverlayV2.tsx')
          s = p.read_text()
          old = '      const map = L.map(element, { zoomControl: true, attributionControl: false, preferCanvas: false, worldCopyJump: true });\n'
          new = '      const map = L.map(element, { zoomControl: true, attributionControl: false, preferCanvas: false, worldCopyJump: true, minZoom: 2 });\n'
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm .github/workflows/navdash-overlay-minzoom-fix.yml
          git diff --check
          npm ci
          npm run build
          git diff -- components/NavMapMainOverlayV2.tsx
          git config user.name "wardolb-bit"
          git config user.email "wardolb@live.com"
          git add components/NavMapMainOverlayV2.tsx .github/workflows/navdash-overlay-minzoom-fix.yml
          git commit -m "Limit map zoom-out at Date Line"
          git push
