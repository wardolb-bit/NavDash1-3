name: Apply NavDash Preview Patch

on:
  push:
    branches:
      - preview/navdash-weather-projection-cleanup

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Stage NavDash preview patch payload')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/navdash-weather-projection-cleanup
          fetch-depth: 0
      - name: Apply patch and clean payload
        run: |
          base64 -d .codex/navdash-preview.patch.gz.b64 | gunzip > /tmp/navdash-preview.patch
          git apply --ignore-whitespace /tmp/navdash-preview.patch
          rm -f .codex/navdash-preview.patch.gz.b64
          rmdir .codex 2>/dev/null || true
          rm -f .github/workflows/apply-navdash-preview-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/wx/route.ts app/page.tsx app/phone/page.tsx app/wx-routing/page.tsx
          git rm -f --ignore-unmatch .codex/navdash-preview.patch.gz.b64 .github/workflows/apply-navdash-preview-patch.yml
          git commit -m "Update NavDash weather and projection flows"
          git push origin HEAD:preview/navdash-weather-projection-cleanup
