name: Apply NavDash cleanup phase 5

on:
  push:
    paths:
      - '.github/workflows/apply-audit-cleanup-phase5.yml'

permissions:
  contents: write

jobs:
  runtime-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Verify persisted raw GRIB has no consumers
        run: |
          COUNT=$(grep -R --line-number --exclude-dir=.git --exclude='route.ts' --exclude='audit_cleanup_phase5.py' 'savedFileName\|current-grib\.grb2' app components lib scripts 2>/dev/null | wc -l)
          test "$COUNT" -eq 0
      - name: Apply runtime-data cleanup
        run: |
          python scripts/audit_cleanup_phase5.py
          rm -f data/grib/current-grib.grb2 data/grib/current-grib-summary.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Full checks
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Commit runtime-data cleanup
        run: |
          rm .github/workflows/apply-audit-cleanup-phase5.yml scripts/audit_cleanup_phase5.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Audit cleanup phase 5: move mutable GRIB state out of Git"
          git push origin HEAD:audit-cleanup-preview-2026-09-15
