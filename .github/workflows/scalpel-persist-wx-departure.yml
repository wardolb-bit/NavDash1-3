name: Scalpel persist WX departure time

on:
  push:
    paths:
      - '.github/workflows/scalpel-persist-wx-departure.yml'

permissions:
  contents: write

jobs:
  patch:
    strategy:
      fail-fast: false
      matrix:
        branch:
          - main
          - audit-cleanup-preview-2026-09-15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply departure-time persistence scalpel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/wx-routing/page.tsx')
          text = path.read_text(encoding='utf-8')

          key_anchor = 'export default function WxRoutingPage() {'
          key_insert = 'const WX_DEPARTURE_TIME_STORAGE_KEY = "navdash-wx-routing-departure-time-v1";\n\nexport default function WxRoutingPage() {'
          if 'WX_DEPARTURE_TIME_STORAGE_KEY' not in text:
              if text.count(key_anchor) != 1:
                  raise SystemExit(f'Expected one page export anchor, found {text.count(key_anchor)}')
              text = text.replace(key_anchor, key_insert, 1)

          state_anchor = '  const [departureTime, setDepartureTime] = useState("");\n'
          loaded_state = state_anchor + '  const [departureTimeLoaded, setDepartureTimeLoaded] = useState(false);\n'
          if 'departureTimeLoaded' not in text:
              if text.count(state_anchor) != 1:
                  raise SystemExit(f'Expected one departure state anchor, found {text.count(state_anchor)}')
              text = text.replace(state_anchor, loaded_state, 1)

          effect_anchor = '  const timeline = gribSummary?.timeline || [];\n'
          effects = '''  useEffect(() => {\n    try {\n      const savedDepartureTime = window.localStorage.getItem(WX_DEPARTURE_TIME_STORAGE_KEY) || "";\n      setDepartureTime(savedDepartureTime);\n    } catch {}\n    setDepartureTimeLoaded(true);\n  }, []);\n\n  useEffect(() => {\n    if (!departureTimeLoaded) return;\n    try {\n      if (departureTime) window.localStorage.setItem(WX_DEPARTURE_TIME_STORAGE_KEY, departureTime);\n      else window.localStorage.removeItem(WX_DEPARTURE_TIME_STORAGE_KEY);\n    } catch {}\n  }, [departureTime, departureTimeLoaded]);\n\n  const timeline = gribSummary?.timeline || [];\n'''
          if 'savedDepartureTime' not in text:
              if text.count(effect_anchor) != 1:
                  raise SystemExit(f'Expected one timeline anchor, found {text.count(effect_anchor)}')
              text = text.replace(effect_anchor, effects, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: TypeScript check
        run: npm run typecheck --if-present || npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Commit branch patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/wx-routing/page.tsx package-lock.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Persist WX departure time in browser"
          git push origin HEAD:${{ matrix.branch }}
