name: Apply NavDash cleanup phase 4

on:
  push:
    paths:
      - '.github/workflows/apply-audit-cleanup-phase4.yml'

permissions:
  contents: write

jobs:
  modularize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Apply WX modularization
        run: python scripts/audit_cleanup_phase4.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Orphan check
        run: npm run check:orphans
      - name: Production build
        run: npm run build
      - name: Commit WX modularization
        run: |
          rm .github/workflows/apply-audit-cleanup-phase4.yml scripts/audit_cleanup_phase4.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Audit cleanup phase 4: modularize WX routing"
          git push origin HEAD:audit-cleanup-preview-2026-09-15
